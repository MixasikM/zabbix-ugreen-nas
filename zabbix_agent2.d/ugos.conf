# Custom UserParameters for UGREEN NAS (UGOS Pro) Zabbix Monitoring

# 1. System Info & Extended Inventory
UserParameter=ugos.version,cat /host/etc/os-release 2>/dev/null | grep PRETTY_NAME | cut -d'=' -f2 | tr -d '"' | head -n 1
UserParameter=ugos.model,cat /host/sys/class/dmi/id/product_name 2>/dev/null | head -n 1 || echo "Ugreen NAS"
UserParameter=ugos.serial,cat /host/sys/class/dmi/id/product_serial 2>/dev/null | head -n 1 || echo "N/A"
UserParameter=ugos.mac,cat /host/sys/class/net/$(ip route get 1.1.1.1 2>/dev/null | grep -oE 'dev [^ ]+' | awk '{print $2}')/address 2>/dev/null || echo "N/A"
UserParameter=ugos.arch,uname -m | head -n 1
UserParameter=ugos.vendor,cat /host/sys/class/dmi/id/sys_vendor 2>/dev/null | head -n 1 || echo "UGREEN"
UserParameter=ugos.bios.date,cat /host/sys/class/dmi/id/bios_date 2>/dev/null | head -n 1 || echo "N/A"
UserParameter=ugos.ip,ip route get 1.1.1.1 2>/dev/null | grep -oE 'src [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}' | head -n 1 || echo "N/A"
UserParameter=ugos.gateway,ip route get 1.1.1.1 2>/dev/null | grep -oE 'via [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}' | head -n 1 || echo "N/A"
UserParameter=ugos.kernel,uname -r 2>/dev/null | head -n 1 || echo "N/A"

# 2. Hardware Sensors & Dynamic Fan Discovery
UserParameter=ugos.fan.discovery,python3 -c "import json,re,os;f=open('/host/proc/it86/fan' if os.path.exists('/host/proc/it86/fan') else '/proc/it86/fan').read() if (os.path.exists('/host/proc/it86/fan') or os.path.exists('/proc/it86/fan')) else '';m=re.findall(r'(\w+)\s+speed\s*:\s*\d+',f,re.I);fmt=lambda k: 'CPU Fan' if k.lower()=='cpufan' else ('System Fan '+k.lower().replace('sysfan','')) if k.lower().startswith('sysfan') else k.capitalize();print(json.dumps([{'{#FANKEY}':x,'{#FANNAME}':fmt(x)} for x in m]))" 2>/dev/null || echo "[]"
UserParameter=ugos.fan.speed[*],python3 -c "import re,os;f=open('/host/proc/it86/fan' if os.path.exists('/host/proc/it86/fan') else '/proc/it86/fan').read() if (os.path.exists('/host/proc/it86/fan') or os.path.exists('/proc/it86/fan')) else '';m=re.search(r'$1.*?(\d+)',f,re.I);print(m.group(1) if m else 0)" 2>/dev/null || echo 0
UserParameter=ugos.board.temp[*],expr $(cat $(find /host/sys/devices/ -name "temp1_input" 2>/dev/null | head -n 1) 2>/dev/null || cat /host/sys/class/thermal/thermal_zone0/temp 2>/dev/null || echo 0) / 1000

# 3. Storage Pools & RAID Array Discovery
UserParameter=ugos.mdstat.discovery,python3 -c "import json,re;f=open('/host/proc/mdstat' if __import__('os').path.exists('/host/proc/mdstat') else '/proc/mdstat').read();m=re.findall(r'^(md\d+)\s*:\s*(?:active\s+)?(\w+)',f,re.M);print(json.dumps([{'{#MDNAME}':x[0],'{#MDLEVEL}':x[1],'{#VOLNAME}':'Volume '+x[0].replace('md','')} for x in m]))" 2>/dev/null || echo "[]"
UserParameter=ugos.mdstat.degraded[*],python3 -c "import re;f=open('/host/proc/mdstat' if __import__('os').path.exists('/host/proc/mdstat') else '/proc/mdstat').read();n='$1';b=[x for x in f.split('\n\n') if not n or n in x];print(sum(1 for x in b if re.search(r'\[.*_.*\]',x)))" 2>/dev/null || echo 0
UserParameter=ugos.btrfs.errors[*],btrfs device stats $1 2>/dev/null | grep -v ' 0$' | wc -l | tail -n 1

# 4. UPS Status (if Network UPS Tools / NUT is enabled)
UserParameter=ugos.ups.charge[*],upsc $1 battery.charge 2>/dev/null | head -n 1 || echo 100
UserParameter=ugos.ups.status[*],upsc $1 ups.status 2>/dev/null | head -n 1 || echo "OL"
